name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/test_db?schema=public"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dummy"
      CLERK_SECRET_KEY: "sk_test_dummy"
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
      GEMINI_API_KEY: "dummy_key"
      RESEND_API_KEY: "dummy_key"
      ARCJET_KEY: "dummy_key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate || true

      - name: Linting
        run: npm run lint --if-present

      - name: Type-checking
        run: npx tsc --noEmit || npm run typecheck --if-present

      - name: Testing
        run: npx vitest run --passWithNoTests || npm run test --if-present

      - name: Building
        run: npm run build
